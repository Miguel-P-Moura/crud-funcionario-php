<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo de vida</title>
</head>
<body>
    <h1>Tempo de vida</h1>
    <hr>
    <!--Crie um aplicação em php que receba, por meio de um formulário o nome e o ano de nasciumento de uma pessoa. Com esses dados deverá calcular e exibir:
    -A quantidade atual da pessoa;
    -A quantidade aproximada de dias horas e minutos que ela já viveu
    -A quantidade aproximada de batimentos cardíacos que seu coração já deu, considerando uma média de 75 batimentos por minuto;
    -Quantos batimentos cardíacos ainda restam, considerando uma expectativa de vida média de 90 anos.
    ATENÇÃO:
    Se a pessoa já tiver ultrapassado essa expectativa, o sistema deve exibir uma mensagem informando isso, em vez de um valor negativo.-->


    <form action="calcular.php" method="post">
    <label for="n">Nome</label>
    <input type="text" name="Tnome" required>
    <p>
    <label for="a">Ano de nascimento</label>
    <input type="number" name="Tano" required min="1910" max="2026">
    </p>
    <input type="submit" value="Calcular">
    <input type="reset" value="Limpar">
    </form>
</body>
</html>
